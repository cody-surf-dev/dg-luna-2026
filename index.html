<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<meta name="mobile-web-app-capable" content="yes">

<title>Даша и Габи едут</title>

<style>
*{box-sizing:border-box}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: countdown on top, one illustrated postcard (scene + handwritten back), route bar below. Single committed warm look. */
:root{
  --ink:#2b2340;
  --ink-soft:#6b6385;
  --paper:#fffaf2;
  --line:#e7dccb;
  --stamp:#e2574c;
  --sea:#2bb3b1;
  --bg-top:#cfe0f2;
  --bg-bot:#ffd9b8;
  --f-display:"Unbounded",system-ui,sans-serif;
  --f-hand:"Marck Script","Segoe Script",cursive;
  --f-body:"Manrope",system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{
  background:var(--bg-bot);
  background-image:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 100%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 40px;
}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{text-align:center;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(64px,22vw,112px);line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big-label{font-family:var(--f-hand);font-size:30px;line-height:1.1;text-wrap:balance}
.clock{display:flex;justify-content:center;gap:8px;margin-top:6px}
.clock div{background:rgba(255,250,242,.7);border:1px solid rgba(43,35,64,.08);border-radius:10px;padding:6px 10px;min-width:58px}
.clock b{display:block;font-family:var(--f-display);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.clock span{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em}

.card{background:var(--paper);border-radius:6px;padding:12px 12px 18px;box-shadow:0 1px 0 rgba(43,35,64,.06),0 18px 40px -18px rgba(43,35,64,.45);transform:rotate(-1deg);display:flex;flex-direction:column;gap:12px}
.art{border-radius:3px;overflow:hidden;background:#e8eef5;aspect-ratio:3/2;max-width:100%}
.art svg,.art img{width:100%;height:100%;display:block;object-fit:cover}
.scene{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--stamp);padding:0 6px}
.back{display:grid;grid-template-columns:1fr auto;gap:12px;padding:0 6px;align-items:start}
.msg{font-family:var(--f-hand);font-size:25px;line-height:1.3;color:var(--ink);min-width:0;text-wrap:pretty}
.sign{font-family:var(--f-hand);font-size:22px;color:var(--ink-soft);margin-top:8px}
.stamp{width:74px;height:88px;border:2px dashed var(--stamp);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--stamp);transform:rotate(4deg);gap:2px;text-align:center}
.stamp b{font-family:var(--f-display);font-size:24px;line-height:1}
.stamp span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.post{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);letter-spacing:.04em}
.art{position:relative}
.game{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;background:var(--paper)}
.tile{border:0;padding:0;background-repeat:no-repeat;background-size:300% 300%;cursor:pointer;transition:transform .15s,outline-color .15s;outline:3px solid transparent;outline-offset:-3px}
.tile.sel{outline-color:var(--stamp);transform:scale(.94)}
.tile:focus-visible{outline-color:var(--ink)}
.solved .game{gap:0}
.scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.hint{font-size:13px;font-weight:600;color:var(--stamp);padding:0 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hint button{font:600 12px var(--f-body);color:var(--ink-soft);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
.msg.locked{color:var(--ink-soft);filter:blur(5px);user-select:none}
.burst{position:absolute;pointer-events:none;font-size:22px;animation:fly 1.4s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
.quiz{display:flex;flex-direction:column;gap:10px;padding:0 6px}
.quiz .q{font:700 16px/1.35 var(--f-body);color:var(--ink);text-wrap:balance}
.quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quiz .opts button{font:600 14px/1.3 var(--f-body);color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 8px;cursor:pointer;text-align:center;min-height:48px}
.quiz .opts button.no{border-color:#e7b1ad;color:#b9524b;text-decoration:line-through;opacity:.7}
.quiz .opts button.yes{border-color:#2bb3b1;background:#e6f7f5}
.quiz .fb{font-size:13px;color:var(--stamp);font-weight:600;min-height:1.2em}
.lockimg{filter:blur(14px) saturate(.8);transform:scale(1.1)}
.lockbadge{position:absolute;inset:0;display:grid;place-items:center;font:700 15px var(--f-display);color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.mem{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:6px;padding:8px;background:var(--paper)}
.mem button{-webkit-appearance:none;appearance:none;padding:0;border:0;border-radius:8px;background:linear-gradient(135deg,#7fa6d6,#ff9a6b);font-size:clamp(20px,6vw,34px);line-height:1;cursor:pointer;transition:background .2s}
.mem button span{opacity:0;transition:opacity .15s}
.mem button.up,.mem button.ok{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.mem button.up span,.mem button.ok span{opacity:1}
.mem button.ok{opacity:.55}
.gbox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;background:rgba(255,250,242,.86);text-align:center}
.gbox .big2{font:700 clamp(15px,4.4vw,20px) var(--f-display);color:var(--ink)}
.gbox .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.gb{-webkit-appearance:none;appearance:none;font:700 clamp(16px,5vw,22px) var(--f-body);color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;min-width:44px;min-height:44px;padding:4px 10px;cursor:pointer;line-height:1}
.gb:disabled{opacity:.35}
.gb.lit{background:#ffe1a8;border-color:#f2a43a;transform:scale(1.08)}
.ttt{display:grid;grid-template-columns:repeat(3,clamp(44px,13vw,60px));gap:5px}
.ttt .gb{height:clamp(44px,13vw,60px);font-size:clamp(20px,6vw,28px)}
.heartdot{position:absolute;font-size:30px;line-height:1;border:0;background:none;cursor:pointer;padding:6px;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
.findgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%;max-width:340px}
.findgrid .gb{min-width:0;padding:4px 0;font-size:clamp(18px,5.4vw,26px)}
.rot{transition:transform .2s}

.art video{width:100%;height:100%;display:block;object-fit:cover;background:#000}
.playbtn{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:0;background:rgba(255,250,242,.92);color:var(--stamp);font-size:34px;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.35);padding-left:6px}
.playlabel{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:700 14px var(--f-body);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.nav{display:flex;gap:6px}
.nav button{font:600 12px var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:99px;padding:5px 11px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}

.route{display:flex;flex-direction:column;gap:8px}
.route-row{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink-soft)}
.bar{height:8px;border-radius:99px;background:rgba(43,35,64,.1);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#7fa6d6,var(--sea),#ff9a6b)}
.bar em{position:absolute;top:50%;transform:translate(-50%,-50%) rotate(90deg);font-style:normal;font-size:18px;line-height:1}
footer{text-align:center;font-size:12px;color:var(--ink-soft)}
@media (prefers-reduced-motion:no-preference){.card{animation:land .9s cubic-bezier(.2,.8,.2,1) both}@keyframes land{from{transform:translateY(14px) rotate(-3deg)}to{transform:rotate(-1deg)}}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Иркутск → Пхукет</div>
    <div class="big" id="days">—</div>
    <div class="big-label" id="daysLabel">дней до встречи</div>
    <div class="clock" aria-label="Точное время до встречи">
      <div><b id="h">00</b><span>часов</span></div>
      <div><b id="m">00</b><span>минут</span></div>
      <div><b id="s">00</b><span>секунд</span></div>
    </div>
  </header>

  <article class="card">
    <div class="art" id="art" role="img" aria-label="Открытка дня"></div>
    <div class="scene" id="scene"></div>
    <div class="hint" id="hint" hidden></div>
    <div class="quiz" id="quiz" hidden></div>
    <div class="back">
      <div>
        <div class="msg" id="msg"></div>
        <div class="sign">— твой Женя</div>
      </div>
      <div class="stamp"><span>открытка</span><b id="no">1</b><span>из Раваи</span></div>
      <div class="post">
        <span id="today"></span>
        <div class="nav">
          <button id="prev" type="button">← вчерашняя</button>
          <button id="next" type="button">следующая →</button>
        </div>
      </div>
    </div>
  </article>

  <section class="route" aria-label="Сколько пути уже позади">
    <div class="route-row"><span>Иркутск ❄</span><span id="pct">0%</span><span>☀ Пхукет</span></div>
    <div class="bar"><i id="fill"></i><em id="plane">✈</em></div>
  </section>

  <footer id="foot">Только для нас троих. Новая открытка каждый день</footer>
</div>

<script>
// ===== Настройки =====
const PAGE_VER="1792666172";
const TEST = location.hash==="#zhenya-test"; // тестовый режим
const ARRIVAL = new Date("2026-12-05T12:00:00+07:00"); // дата приезда (время Пхукета)
const START   = new Date("2026-10-15T06:00:00+08:00"); // день запуска странички

const MESSAGES = [
  "Смотрю на ту же луну, что и ты. Значит, мы не так уж далеко друг от друга.",
  "Нашёл кафе с видом на море. Столик на двоих уже присмотрел.",
  "Габи тут понравится: песок тёплый, а голуби непуганые.",
  "Здесь +31, а я всё равно жду, когда станет по-настоящему тепло. Это когда ты приедешь.",
  "Сегодня море было такого цвета, что хочется показать только тебе.",
  "Скучаю по тому, как ты смеёшься с моих дурацких шуток.",
  "Тренирую фразу «моя жена прилетает» на тайском. Пока плохо.",
  "Кровать слишком большая для одного. Это официальная жалоба.",
  "Купил второй стакан для кофе. Пусть пока постоит.",
  "Нашёл пляж, где утром никого нет. Это будет наш пляж.",
  "Представляю, как Габи впервые увидит море и не поверит, что столько воды бывает.",
  "Ещё чуть-чуть, и твоя шапка уедет в шкаф надолго.",
  "Манго тут такое, что я готов ради него на многое. Но ради тебя на всё.",
  "Каждый день на один шаг ближе. Сегодняшний шаг сделан.",
  "Местный кот пытался со мной подружиться. Сказал ему, что у меня есть Габи.",
  "Ты лучшее, что со мной случалось, и скоро ты случишься тут.",
  "Вечером было слышно, как шумит море, и мне не хватало твоего «смотри!».",
  "Ты храбрая: собрать дом, собаку и себя и перелететь полмира. Я горжусь тобой.",
  "Пообещал себе, что первый закат мы встретим на берегу. Держу место.",
  "Если тебе сегодня тяжело, вспомни: тут тебя ждёт тёплое море и я.",
  "Проверил: облака тут похожи на Габи примерно в каждом третьем случае.",
  "Ещё немного, и будем спорить, кто первый идёт плавать.",
  "Твоя красная бандана тут будет смотреться идеально. Привези её обязательно.",
  "Сегодня шёл дождь, тёплый, как ванна. Тебе понравится.",
  "У меня тут всё есть, кроме самого главного.",
  "Габи, держись. Скоро твои лапы узнают, что такое тёплый песок.",
  "Каждое утро начинаю с мысли, сколько дней осталось. Сегодня меньше, чем вчера.",
  "Хочу показать тебе фонарики на ночном рынке. Они как гирлянда на Новый год, только круглый год.",
  "Ты моё самое любимое «скоро».",
  "Я тут всё подготовлю. Тебе останется только приехать и сказать «вау».",
  "Иркутск, отдавай её уже. Пожалуйста.",
  "Сегодня был красивый день. Завтра будет на один день ближе к лучшему.",
  "Посчитал: до тебя примерно 5000 км. Скоро будет ноль.",
  "Скучаю. Это всё, что хотел сказать сегодня. Ну и что люблю.",
  "Сегодня видел пару с маленькой собакой на пляже и улыбался как дурак.",
  "Привези свою улыбку. Остальное найдём тут.",
  "Море передаёт привет. И я.",
  "Обнимаю тебя через полмира. Скоро обниму по-настоящему.",
  "Тут тепло, а с тобой будет как дома.",
  "Обратный отсчёт идёт. Сердце уже прилетело заранее.",
  "Почти. Совсем почти.",
  "Последние дни самые длинные. Давай вместе их потерпим.",
  "Гусь на диване уже занял твоё место. Приезжай отвоёвывать.",
  "Габи, в розовом худи тут будет жарко. Готовь футболочки.",
  "Помню, как ты смеялась в лифте. Тут лифты тоже есть, приезжай."
];

// Картинки из Gemini: номер открытки → файл и подпись
const IMAGES = {
  1: {src:"img/01.jpg", title:"Одна луна на двоих"},
  2: {src:"img/02.jpg", title:"Вечерний созвон", msg:"Твоё лицо на экране — лучшая часть моего дня. Габи, тебе тоже привет."},
  3: {src:"img/03.jpg", title:"Родной Свирск", msg:"Передай привет Ангаре и нашему Свирску. Мы оттуда вдвоём, а скоро у нас будет ещё одно общее место — у моря."},
  4: {src:"img/04.jpg", title:"Габи ждёт у двери", msg:"Габи, потерпи ещё чуть-чуть. Скоро этот поводок поведёт тебя на пляж."},
  5: {src:"img/05.jpg", title:"Волейбол по видеосвязи", msg:"Лучшая группа поддержки на свете, даже через полмира."},
  6: {src:"img/06.jpg", title:"Снеговик и замок из песка", msg:"Ты лепишь снеговика, я строю замок. Скоро будем строить что-то одно на двоих."},
  7: {src:"img/07.jpg", title:"Манго для Даши", msg:"Выбрал самое красивое манго и сразу сфоткал тебе. Скоро будешь выбирать сама."},
  8: {src:"img/08.jpg", title:"Прогулка по набережной", msg:"Передай набережной привет. Скоро будете с Габи гулять вдоль моря."},
  9: {src:"img/09.jpg", video:"img/09.mp4", title:"Серенада для Даши", msg:"Даша, это посвящается тебе. Ты моя королева вдохновения 🎤 А оригинал — «Реальные пацаны», 2 сезон, 28 серия, 43:20 ❤"},
  10: {src:"img/10.jpg", title:"Сердце на песке", msg:"Волна смоет, а я нарисую снова. Каждый вечер, пока ты не приедешь."},
  11: {src:"img/11.jpg", title:"Какао и снежинки", msg:"Грейся какао и передай Габи, что снежинки — это тренировка перед морскими брызгами."},
  21: {src:"img/21.jpg", title:"Сериал и покер", msg:"Ты с сериалом, я с покером, а машем друг другу всё равно. Скоро будем на одном диване."}
};

// ===== Утилиты =====
const DAY = 864e5;
const tzDay = (d) => Math.floor((d.getTime() + 2*3600e3) / DAY); // новый день в 6:00 по Иркутску (UTC+8)
function plural(n, one, few, many){
  const a=Math.abs(n)%100,b=a%10;
  if(a>10&&a<20) return many; if(b>1&&b<5) return few; if(b===1) return one; return many;
}
function rng(seed){ return () => { seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }; }
const G=(x,y,s,inner,flip)=>`<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})">${inner}</g>`;
const grad=(id,stops,h)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${h?1:0}" y2="${h?0:1}">${stops.map(([o,c])=>`<stop offset="${o}" stop-color="${c}"/>`).join("")}</linearGradient>`;
const heart=(x,y,s,c)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 8 C-16 -2 -8 -15 0 -6 C8 -15 16 -2 0 8Z" fill="${c}"/>`;
function qpt(t,a,b,c){const u=1-t;return [u*u*a[0]+2*u*t*b[0]+t*t*c[0], u*u*a[1]+2*u*t*b[1]+t*t*c[1]].map(v=>v.toFixed(1));}
function palm(x,y,h=260,f=1,col="#2f7a4f",trunk="#7a5236"){
  const tx=x+30*f, ty=y-h;
  let s=`<path d="M${x} ${y} Q${x+44*f} ${y-h*.5} ${tx} ${ty}" stroke="${trunk}" stroke-width="16" fill="none" stroke-linecap="round"/>`;
  for(let i=0;i<7;i++){const a=-Math.PI+i*Math.PI/6, L=115;
    s+=`<path d="M${tx} ${ty} Q${(tx+Math.cos(a)*L*.55).toFixed(1)} ${(ty-34+Math.sin(a)*20).toFixed(1)} ${(tx+Math.cos(a)*L).toFixed(1)} ${(ty+Math.sin(a)*L*.4+48).toFixed(1)}" stroke="${col}" stroke-width="14" fill="none" stroke-linecap="round"/>`;}
  return s;
}
function snow(seed,x0,x1,y0,y1,n){const r=rng(seed);let s="";for(let i=0;i<n;i++)s+=`<circle cx="${(x0+r()*(x1-x0)).toFixed(0)}" cy="${(y0+r()*(y1-y0)).toFixed(0)}" r="${(1.5+r()*3).toFixed(1)}" fill="#fff" opacity=".9"/>`;return s;}

    const win=()=>{markSolved(idx);celebrate();setTimeout(()=>{if(viewIdx===idx)showOpen()},900);};
    const g=gameFor(idx);
    if(g.type==="quiz") quizGame(src,win,hint,g.q,idx);
    else ({puzzle,scratch,memory,catch:catchHearts,anagram,ttt:ticTacToe,rotate:rotateGame,rps,simon,find:findGabi,pump})[g.type](src,win,hint,idx);
  } else showOpen();
  document.getElementById("no").textContent=idx+1;
  const d=new Date(START.getTime()+idx*DAY);
  document.getElementById("today").textContent=d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",timeZone:"Asia/Irkutsk"});
  document.getElementById("prev").disabled=idx<=0;
  document.getElementById("next").disabled=idx>=(TEST?LAST_IDX:todayIdx);
}
document.getElementById("prev").onclick=()=>{viewIdx=Math.max(0,viewIdx-1);showCard(viewIdx)};
document.getElementById("next").onclick=()=>{viewIdx=Math.min(TEST?LAST_IDX:todayIdx,viewIdx+1);showCard(viewIdx)};

function tick(){
  const now=new Date(), ms=ARRIVAL-now, arrived=ms<=0;
  const dToday=tzDay(now), days=Math.max(0,tzDay(ARRIVAL)-dToday);
  const progress=Math.min(1,Math.max(0,(now-START)/(ARRIVAL-START)));
  document.getElementById("days").textContent=arrived?"0":days;
  document.getElementById("daysLabel").textContent=arrived?"Мы вместе ❤":days===0?"Сегодня! Ну наконец-то":plural(days,"день","дня","дней")+" до встречи";
  const left=Math.max(0,ms);
  document.getElementById("h").textContent=String(Math.floor(left/36e5)%24).padStart(2,"0");
  document.getElementById("m").textContent=String(Math.floor(left/6e4)%60).padStart(2,"0");
  document.getElementById("s").textContent=String(Math.floor(left/1e3)%60).padStart(2,"0");
  const pct=Math.round(progress*100);
  document.getElementById("pct").textContent=pct+"% пути";
  document.getElementById("fill").style.width=pct+"%";
  document.getElementById("plane").style.left=Math.min(97,Math.max(3,pct))+"%";
  if(dToday!==lastDay){
    lastDay=dToday;
    todayIdx=Math.max(0,dToday-tzDay(START));
    viewIdx=todayIdx; showCard(todayIdx);
  }
}
if(TEST){const f=document.getElementById("foot");f.textContent="Тестовый режим: листай все дни, прогресс игр не сохраняется";f.style.color="#e2574c";f.style.fontWeight="700";}
tick(); setInterval(tick,1000);
// автообновление: если на сайте вышла новая версия, страница перезагрузится сама
async function checkVer(){try{const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});const v=(await r.text()).trim();if(v&&v!==PAGE_VER)location.reload();}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){checkVer();tick();}});
window.addEventListener("pageshow",checkVer);
setInterval(checkVer,10*60*1000);
</script>
